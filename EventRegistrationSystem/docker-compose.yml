version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: event_registration_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: event_registration_api
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "5002:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: event_registration_ui
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
